<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>OJT Progress Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">

    <h1>OJT Progress Tracker</h1>

    <!-- Input Form -->
    <div class="form-box">
      <input type="text" id="taskInput" placeholder="Enter Task Title">

      <input type="text" id="categoryInput" placeholder="Enter Category">

      <input type="date" id="dateInput">

      <select id="statusInput">
        <option value="Pending">Pending</option>
        <option value="In Progress">In Progress</option>
        <option value="Completed">Completed</option>
      </select>

      <button onclick="addTask()">Add Task</button>
    </div>

    <!-- Summary -->
    <div class="summary">
      <h3>Total Tasks: <span id="total">0</span></h3>
      <h3>Completed: <span id="completed">0</span></h3>
      <h3>Pending: <span id="pending">0</span></h3>
    </div>

    <!-- Task List -->
    <div id="taskList"></div>

  </div>

  <script src="script.js"></script>
</body>
</html>
