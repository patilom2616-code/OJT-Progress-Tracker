<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OJT Progress Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>OJT Progress Tracker</h1>

    <div class="summary">
        <div>Total: <span id="total">0</span></div>
        <div>Completed: <span id="completed">0</span></div>
        <div>Pending: <span id="pending">0</span></div>
    </div>

    <input type="text" id="search" placeholder="Search Task..." onkeyup="searchTask()">

    <div class="form">
        <input type="text" id="title" placeholder="Task Title">

        <input type="text" id="category" placeholder="Category">

        <input type="date" id="date">

        <select id="status">
            <option>Pending</option>
            <option>In Progress</option>
            <option>Completed</option>
        </select>

        <textarea id="notes" placeholder="Notes"></textarea>

        <button onclick="addTask()">Add Task</button>
    </div>

    <div id="taskList"></div>

</div>

<script src="script.js"></script>
</body>
</html>
