<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OJT Progress Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background-shapes">
    <span class="shape shape1"></span>
    <span class="shape shape2"></span>
    <span class="shape shape3"></span>
</div>

<div class="container">

    <header class="dashboard-header">
        <div>
            <h1>🚀 OJT Progress Tracker</h1>
            <p>Manage daily learning activities, track progress and stay productive.</p>
        </div>

        <div class="chip">OJT Dashboard</div>
    </header>

    <div class="summary">
        <div class="summary-card">
            <span>Total Tasks</span>
            <strong id="total">0</strong>
        </div>

        <div class="summary-card success">
            <span>Completed</span>
            <strong id="completed">0</strong>
        </div>

        <div class="summary-card warning">
            <span>Pending</span>
            <strong id="pending">0</strong>
        </div>
    </div>

    <div class="toolbar">
        <input
            type="text"
            id="search"
            placeholder="🔍 Search Tasks..."
            onkeyup="searchTask()">
    </div>

    <div class="form">
        <input type="text" id="title" placeholder="Task Title">

        <input type="text" id="category" placeholder="Category">

        <input type="date" id="date">

        <select id="status">
            <option>Pending</option>
            <option>In Progress</option>
            <option>Completed</option>
        </select>

        <textarea id="notes" placeholder="Notes"></textarea>

        <button onclick="addTask()">Add Task</button>
    </div>

    <div id="taskList" class="task-grid"></div>

    <div id="noResults" class="hidden">
        No matching tasks found.
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
